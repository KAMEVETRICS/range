name: range

x-range-service: &range-service
  build:
    context: ..
    dockerfile: infra/Dockerfile
    target: runtime
  init: true
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped
  stop_grace_period: 20s
  deploy:
    resources:
      limits: { cpus: "1.0", memory: 768M }
      reservations: { memory: 128M }

x-node-healthcheck: &node-healthcheck
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 20s

x-connector-environment: &connector-environment
  NODE_ENV: production
  REDPANDA_BROKERS: redpanda:9092
  HEALTH_PORT: "8081"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    restart: unless-stopped
    command: [redpanda, start, --mode=dev-container, --smp=1, --memory=1G, --reserve-memory=0M,
      "--kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092",
      "--advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092",
      --rpc-addr=0.0.0.0:33145, --advertise-rpc-addr=redpanda:33145]
    ports: ["127.0.0.1:19092:19092", "127.0.0.1:19644:9644"]
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: [CMD, rpk, cluster, health, --exit-when-healthy, -X, brokers=localhost:9092]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }
        reservations: { memory: 512M }

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
    healthcheck: { test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10 }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
        reservations: { memory: 64M }

  postgres:
    image: timescale/timescaledb:2.18.0-pg17
    restart: unless-stopped
    environment: { POSTGRES_DB: range, POSTGRES_USER: range, POSTGRES_PASSWORD: "${RANGE_POSTGRES_PASSWORD:-range-local-only}" }
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../packages/storage/src/migrations/0001_initial.sql:/docker-entrypoint-initdb.d/010-range.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U range -d range && psql -U range -d range -tAc \"SELECT extversion FROM pg_extension WHERE extname = 'timescaledb'\" | grep -q ."]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }
        reservations: { memory: 256M }

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment: { MINIO_ROOT_USER: range-local, MINIO_ROOT_PASSWORD: "${RANGE_MINIO_PASSWORD:-range-local-only}" }
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [minio-data:/data]
    healthcheck: { test: [CMD, curl, -f, http://localhost:9000/minio/health/live], interval: 5s, timeout: 3s, retries: 12, start_period: 10s }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }
        reservations: { memory: 128M }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    restart: unless-stopped
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes: [./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
    ports: ["127.0.0.1:4318:4318", "127.0.0.1:13133:13133"]
    healthcheck: { test: [CMD, /otelcol-contrib, --version], interval: 10s, timeout: 3s, retries: 5 }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
        reservations: { memory: 64M }

  connector-bitget:
    <<: *range-service
    command: [node, --import, tsx, connectors/bitget/src/service.ts]
    environment: *connector-environment
    depends_on: { redpanda: { condition: service_healthy }, otel-collector: { condition: service_healthy } }
    healthcheck: { <<: *node-healthcheck, test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  connector-hyperliquid:
    <<: *range-service
    command: [node, --import, tsx, connectors/hyperliquid/src/service.ts]
    environment: *connector-environment
    depends_on: { redpanda: { condition: service_healthy }, otel-collector: { condition: service_healthy } }
    healthcheck: { <<: *node-healthcheck, test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  connector-extended:
    <<: *range-service
    command: [node, --import, tsx, connectors/extended/src/service.ts]
    environment:
      <<: *connector-environment
      EXTENDED_API_KEY: ${EXTENDED_API_KEY:-}
    depends_on: { redpanda: { condition: service_healthy }, otel-collector: { condition: service_healthy } }
    healthcheck: { <<: *node-healthcheck, test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  connector-ondo-perps:
    <<: *range-service
    command: [node, --import, tsx, connectors/ondo-perps/src/service.ts]
    environment: *connector-environment
    depends_on: { redpanda: { condition: service_healthy }, otel-collector: { condition: service_healthy } }
    healthcheck: { <<: *node-healthcheck, test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  opportunity-worker:
    <<: *range-service
    command: [node, --import, tsx, apps/opportunity-worker/src/service.ts]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://range:${RANGE_POSTGRES_PASSWORD:-range-local-only}@postgres:5432/range
      REDIS_URL: redis://redis:6379
      REDPANDA_BROKERS: redpanda:9092
      RANGE_MAPPING_CONFIG: /app/config/instrument-mappings.json
      RANGE_VENUE_MANIFEST_JSON: '[{"venue":"bitget","freshnessBudgetMs":2000},{"venue":"hyperliquid_hip3","freshnessBudgetMs":2000},{"venue":"extended","freshnessBudgetMs":5000},{"venue":"ondo_perps","freshnessBudgetMs":5000}]'
      RANGE_FEES_BPS_JSON: '{}'
      RANGE_SLIPPAGE_BPS_JSON: '{}'
      HEALTH_PORT: "8081"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: [../config:/app/config:ro]
    depends_on:
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_healthy }
    healthcheck: { <<: *node-healthcheck, test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  gateway:
    <<: *range-service
    command: [node, --import, tsx, apps/gateway/src/service.ts]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://range:${RANGE_POSTGRES_PASSWORD:-range-local-only}@postgres:5432/range
      REDIS_URL: redis://redis:6379
      REDPANDA_BROKERS: redpanda:9092
      RANGE_API_TOKEN_PEPPER: ${RANGE_API_TOKEN_PEPPER:?set RANGE_API_TOKEN_PEPPER to at least 32 characters}
      RANGE_DEMO_API_TOKEN: ${RANGE_DEMO_API_TOKEN:?set RANGE_DEMO_API_TOKEN to at least 24 characters}
      RANGE_DASHBOARD_READ_TOKEN: ${RANGE_DASHBOARD_READ_TOKEN:?set RANGE_DASHBOARD_READ_TOKEN to at least 24 characters}
      RANGE_VENUE_MANIFEST_JSON: '[{"venue":"bitget","capabilities":["orderbook","funding_current"],"freshnessBudgetMs":2000},{"venue":"hyperliquid_hip3","capabilities":["orderbook"],"freshnessBudgetMs":2000},{"venue":"extended","capabilities":["orderbook"],"freshnessBudgetMs":5000},{"venue":"ondo_perps","capabilities":["orderbook"],"freshnessBudgetMs":5000}]'
      RANGE_ALLOWED_HOSTS: localhost,127.0.0.1,gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      opportunity-worker: { condition: service_healthy }
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck: { <<: *node-healthcheck, test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"] }

  dashboard:
    build: { context: .., dockerfile: infra/Dockerfile, target: dashboard }
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    restart: unless-stopped
    environment: { RANGE_DASHBOARD_READ_TOKEN: "${RANGE_DASHBOARD_READ_TOKEN:?set RANGE_DASHBOARD_READ_TOKEN}" }
    ports: ["127.0.0.1:4173:8080"]
    depends_on: { gateway: { condition: service_healthy } }
    healthcheck: { test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz], interval: 10s, timeout: 3s, retries: 5 }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
        reservations: { memory: 32M }

volumes:
  redpanda-data:
  redis-data:
  postgres-data:
  minio-data:
